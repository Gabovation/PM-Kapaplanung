{% extends "layout.html" %}
{% block content %}
<section class="panel">
  <h1>Passwort ändern</h1>
  <p>Nach der Änderung meldest du dich mit dem neuen Passwort erneut an.</p>
  {% if error %}<div class="pt-alert pt-alert--danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="formgrid">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="pt-field"><label class="pt-field__label" for="current-password">Bisheriges Passwort</label><input class="pt-input" id="current-password" name="current_password" type="password" required maxlength="256" autocomplete="current-password"></div>
    <div class="pt-field"><label class="pt-field__label" for="new-password">Neues Passwort (mindestens 12 Zeichen)</label><input class="pt-input" id="new-password" name="new_password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></div>
    <div><button class="pt-button pt-button--primary" type="submit">Passwort ändern</button></div>
  </form>
</section>
{% endblock %}
